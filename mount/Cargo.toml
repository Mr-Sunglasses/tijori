[package]
name = "tijori-mount"
description = "FUSE filesystem over a Tijori vault, with host hardening"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
tijori-core = { path = "../core" }
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

# Build scripts run on the host, so `cc` is needed even when it is unused.
[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
