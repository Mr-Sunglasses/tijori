name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so new RustSec advisories show up even without new commits.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install exFAT tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs
          # The runner's cloud kernel ships the exfat driver in modules-extra.
          sudo modprobe exfat || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe exfat
          }
      - run: cargo build -p tijori-cli --locked
      - name: CLI on a real exFAT volume (loop image on Linux, hdiutil image on macOS)
        run: scripts/e2e.sh target/debug/tijori
      # macOS runners have no macFUSE; the macOS mount is tested locally.
      - name: Mount with FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fuse3
          sudo modprobe fuse || true
          scripts/mount-test.sh target/debug/tijori

  vectors:
    name: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r spec/generator/requirements.txt
      - name: Regenerate deterministic vectors with libsodium and compare
        run: python spec/generator/gen.py --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: Build the documentation site
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: No em or en dashes in the documentation
        run: |
          if grep -rn '—\|–' docs/ README.md mkdocs.yml; then
            echo "Use a comma, colon or parentheses instead of em and en dashes." >&2
            exit 1
          fi

  fuzz-smoke:
    name: fuzz smoke
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 5 minutes
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=300 -rss_limit_mb=4096
          done

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
