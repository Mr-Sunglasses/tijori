[package]
name = "tijori-core"
description = "Tijori vault format, cryptography and vault engine"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bip39 = { version = "3.0", default-features = false, features = ["std", "zeroize"] }
dryoc = { version = "2.0", default-features = false, features = ["std", "protected"] }
keyring = { version = "4.2", optional = true }
secrecy = "0.10"
subtle = "2.6"
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = { version = "1.9", features = ["derive"] }
zxcvbn = { version = "3.1", default-features = false }

[dev-dependencies]
hex = "0.4"
proptest = "1.12"
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true

[features]
# OS integration for desktop frontends: app data folder, device ID and the
# rollback-record key in the OS keychain. Not used on Android.
host = ["dep:keyring"]
