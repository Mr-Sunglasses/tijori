# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# zbus folded these crates into itself; keyring's Secret Service store still
# uses the standalone versions. "Unmaintained" notices, not vulnerabilities.
# Revisit when keyring moves to a newer zbus.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus, reached via keyring" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus, reached via keyring" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus, reached via keyring" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive licences only for dependencies. core/ and ffi/ are Apache-2.0,
# so they must never pull in copyleft code.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# Our own crates are unpublished and carry their licence in Cargo.toml.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Plan §0 rule 7: nothing may contact the network at runtime.
deny = [
    { name = "reqwest", reason = "no network access at runtime" },
    { name = "ureq", reason = "no network access at runtime" },
    { name = "isahc", reason = "no network access at runtime" },
    { name = "attohttpc", reason = "no network access at runtime" },
    { name = "curl", reason = "no network access at runtime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
