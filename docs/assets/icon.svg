<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Tijori</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2a6e"/>
      <stop offset="1" stop-color="#14123a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd877"/>
      <stop offset="0.55" stop-color="#e9a93a"/>
      <stop offset="1" stop-color="#c47f1c"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b94a"/>
      <stop offset="1" stop-color="#d08a22"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#d9962a"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Feet -->
  <rect x="132" y="398" width="56" height="30" rx="8" fill="#a8681a"/>
  <rect x="324" y="398" width="56" height="30" rx="8" fill="#a8681a"/>

  <!-- Body -->
  <rect x="88" y="96" width="336" height="314" rx="44" fill="url(#brass)"/>
  <!-- Door -->
  <rect x="118" y="126" width="276" height="254" rx="28" fill="url(#door)" stroke="#9a5f14" stroke-width="6"/>

  <!-- Hinges -->
  <rect x="104" y="160" width="24" height="52" rx="8" fill="#9a5f14"/>
  <rect x="104" y="294" width="24" height="52" rx="8" fill="#9a5f14"/>

  <!-- Handle -->
  <rect x="356" y="214" width="20" height="80" rx="10" fill="#14123a"/>

  <!-- Dial -->
  <circle cx="246" cy="254" r="84" fill="#14123a"/>
  <circle cx="246" cy="254" r="84" fill="none" stroke="#ffd877" stroke-width="5"/>
  <g stroke="#ffd877" stroke-width="5" stroke-linecap="round">
    <line x1="246" y1="180" x2="246" y2="196"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(30 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(60 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="196" transform="rotate(90 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(120 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(150 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="196" transform="rotate(180 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(210 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(240 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="196" transform="rotate(270 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(300 246 254)"/>
    <line x1="246" y1="180" x2="246" y2="192" transform="rotate(330 246 254)"/>
  </g>

  <!-- Knob with keyhole -->
  <circle cx="246" cy="254" r="48" fill="url(#knob)"/>
  <circle cx="246" cy="242" r="13" fill="#14123a"/>
  <path d="M238 248 L254 248 L259 280 L233 280 Z" fill="#14123a"/>
</svg>
